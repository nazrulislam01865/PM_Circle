services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: pm_circle
      POSTGRES_USER: pm_circle
      POSTGRES_PASSWORD: ${PM_DB_PASSWORD:?Set PM_DB_PASSWORD in your shell for local Docker}
    volumes:
      - pm_circle_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pm_circle -d pm_circle']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - pm_circle_redis:/data
volumes:
  pm_circle_postgres:
  pm_circle_redis:
